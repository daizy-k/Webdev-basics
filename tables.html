<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tables</title>
  <style>
    /* Styling the table using internal CSS */
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse; /* Merges double borders into one */
    }

    th, td {
      border: 1px solid #333333; /* Hexadecimal color code */
      padding: 10px;             /* Inner spacing */
      text-align: left;
    }

    th {
      background-color: #312e81;
      color: #ffffff;
    }

    /* Zebra striping for alternate rows */
    tr:nth-child(even) {
      background-color: #f2f2f2;
    }
  </style>
</head>

<body>

  <h1>HTML Tables</h1>

  <table>
    <thead>
      <tr>
        <th>First Name</th>
        <th>Last Name</th>
        <th>Email</th>
        <th>DOB</th>
        <th>Gender</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Jane</td>
        <td>Doe</td>
        <td>jane@yahoo.com</td>
        <td>19-10-2008</td>
        <td>F</td>
      </tr> 

      <tr>
        <td>Jack</td>
        <td>Jill</td>
        <td>jack@yahoo.com</td>
        <td>19-12-2018</td>
        <td>M</td>
      </tr> 

      <tr>
        <td>John</td>
        <td>Doe</td>
        <td>john@yahoo.com</td>
        <td>19-05-2005</td>
        <td>M</td>
      </tr>

      <tr>
        <td>Jane</td>
        <td>Doe</td>
        <td>jane@yahoo.com</td>
        <td>19-10-2008</td>
        <td>F</td>
      </tr>
    </tbody>
  </table>

</body>

</html>
