<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forms</title>
<style>



</style>
</head>

<body>

<!-- text, email, password, number, date, radio, checkbox, select, submit -->

<form>
<label for="names">Names</label>
<input type="text" required id="names" name="full_name" placeholder="Jane Doe">

<br>
<label for="email">Email</label>
<input type="email" required id="email" name="email" placeholder="doe@example.com">

<br>

<label for="pass">Password</label>
<input type="password" required id="pass" name="pass" placeholder="*******">

<br>
<label for="weight">Weight</label>
<input type="number" min="30" max="250" step="0.01" required id="weight" name="weight"
placeholder="Weight in Kgs">

<br>
<label for="dob">Date of Birth</label>
<input type="date" min="1940-01-01" max="2008-12-31" required id="dob" name="dob">



<!-- name must be the same for radio buttons -->
<br>
<input type="radio" id="m" name="gender" value="F">
<label for="m">Female</label>

<br>
<input type="radio" id="f" name="gender" value="M">
<label for="f">Male</label>

<hr>

<input type="checkbox" id="x" name="food" value="P001">
<label for="x">Pizza</label>

<br>
<input type="checkbox" id="y" name="food">
<label for="y">Burger</label>

<br>
<input type="checkbox" id="z" name="food">
<label for="z">Ugali</label>
<p>Lorem ipsum dolor sit amet</p>



<br>
<select>
<option>Select County</option>
<option value="1">Mombasa</option>
<option value="2">Nairobi</option>
<option value="3">Nyeri</option>
<option value="4">Kisumu</option>
<option value="5">Kisii</option>
</select>



<br>
<button>Register</button>

</form>

</body>

</html>
